name: Publish Package to npmjs
on:
  release:
    types: [created]
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Build and pack
        run: |
          pnpm install --frozen-lockfile
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          pnpm build
          pnpm --dir packages/beff-cli pack --out "$RUNNER_TEMP/beff-cli.tgz"
          pnpm --dir packages/beff-client pack --out "$RUNNER_TEMP/beff-client.tgz"
      - name: Publish with OIDC
        run: |
          npm publish "$RUNNER_TEMP/beff-cli.tgz" --access public
          npm publish "$RUNNER_TEMP/beff-client.tgz" --access public
