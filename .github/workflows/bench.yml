name: Bench
# Manual only: start it with `gh workflow run bench.yml --ref <branch>`.
# Do not add push or pull_request triggers. See bench/README.md.
on:
  workflow_dispatch:
    inputs:
      shape:
        description: "Shape to run (empty = all shapes)"
        required: false
        default: ""
      compile_args:
        description: "Extra args for compile.mjs (--from, --rows)"
        required: false
        default: ""
      runtime_args:
        description: "Extra args for runtime.mjs (--scale, --from, --rows)"
        required: false
        default: ""
      stress_args:
        description: "Extra args for stress.mjs (--scale, --runs, --seed)"
        required: false
        default: ""
      load_args:
        description: "Extra args for load.mjs (--scale)"
        required: false
        default: ""
      baseline_ref:
        description: "Branch, tag or commit to compare with in the same job (empty = no comparison)"
        required: false
        default: "main"
      compare_args:
        description: "Extra args for compare.mjs (--rounds, --scale, --load-scale)"
        required: false
        default: ""
jobs:
  bench:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
        with:
          # The baseline can be any commit of the repository.
          fetch-depth: 0
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: actions/setup-node@v3
        with:
          node-version: "22.x"
      - name: Build (release)
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          pnpm install
          pnpm build
      - name: Bench
        working-directory: bench
        env:
          SHAPE: ${{ inputs.shape }}
          COMPILE_ARGS: ${{ inputs.compile_args }}
          RUNTIME_ARGS: ${{ inputs.runtime_args }}
          STRESS_ARGS: ${{ inputs.stress_args }}
          LOAD_ARGS: ${{ inputs.load_args }}
        run: |
          shape=${SHAPE:+--shape $SHAPE}
          status=0
          for s in "compile $COMPILE_ARGS" "runtime $RUNTIME_ARGS" "stress $STRESS_ARGS" "load $LOAD_ARGS"; do
            set -- $s
            name=$1
            shift
            echo "## node $name.mjs $shape $*" >> "$GITHUB_STEP_SUMMARY"
            set +e
            node "$name.mjs" $shape "$@" 2>&1 | tee "$name.txt"
            code=${PIPESTATUS[0]}
            set -e
            # compile, runtime and load print markdown tables; stress prints plain text.
            if [ "$name" = stress ]; then
              printf '\n```\n%s\n```\n' "$(cat "$name.txt")" >> "$GITHUB_STEP_SUMMARY"
            else
              cat "$name.txt" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$code" != 0 ]; then
              echo "**$name.mjs exited with code $code**" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
            echo >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
      - name: Build the baseline (release)
        if: ${{ !cancelled() && inputs.baseline_ref != '' }}
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          commit=$(git rev-parse --verify --quiet "origin/$BASELINE_REF^{commit}" || git rev-parse --verify "$BASELINE_REF^{commit}")
          git worktree add --detach "$RUNNER_TEMP/baseline" "$commit"
          cd "$RUNNER_TEMP/baseline"
          pnpm install
          pnpm build
      - name: Compare with the baseline
        if: ${{ !cancelled() && inputs.baseline_ref != '' }}
        working-directory: bench
        env:
          SHAPE: ${{ inputs.shape }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
          COMPARE_ARGS: ${{ inputs.compare_args }}
        run: |
          shape=${SHAPE:+--shape $SHAPE}
          set -o pipefail
          echo "## node compare.mjs $shape $COMPARE_ARGS (baseline: $BASELINE_REF, candidate: $GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"
          node compare.mjs --baseline "$RUNNER_TEMP/baseline" $shape $COMPARE_ARGS | tee compare.txt
          cat compare.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench/*.txt
